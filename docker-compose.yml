services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./app/data/azureplatform.db
    volumes:
      - ./backend/app/data:/app/app/data
      - ./generated:/app/generated
      - ./gitops:/app/gitops
      - ./reports:/app/reports
      - ./policy:/app/policy
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
