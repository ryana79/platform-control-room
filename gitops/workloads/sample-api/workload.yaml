apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-api
  namespace: dev
  labels:
    app.kubernetes.io/name: sample-api
    owner: platform
    environment: dev
    cost-center: cc-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-api
        owner: platform
        environment: dev
        cost-center: cc-demo
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
---
apiVersion: v1
kind: Service
metadata:
  name: sample-api
  namespace: dev
  labels:
    owner: platform
    environment: dev
    cost-center: cc-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sample-api
  ports:
    - port: 80
      targetPort: 80
